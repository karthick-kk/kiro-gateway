version: '3.8'

services:
  kiro-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiro-gateway
    ports:
      - "8000:8000"
    environment:
      # Server configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000

      # Required: Set your proxy API key
      - PROXY_API_KEY=${PROXY_API_KEY:-my-super-secret-password-123}

      # kiro-cli SQLite database (auto-populated by token-refresh sidecar)
      - KIRO_CLI_DB_FILE=/data/kiro-cli/data.sqlite3

      # SQLite write-back enabled so refreshed tokens are persisted
      # (keeps kiro-cli on host in sync with gateway's token refreshes)
      - SQLITE_READONLY=false

      # Authentication fallbacks (if not using kiro-cli)
      # Option 1: Refresh token
      - REFRESH_TOKEN=${REFRESH_TOKEN:-}
      # Option 2: Profile ARN (optional, for Kiro IDE)
      - PROFILE_ARN=${PROFILE_ARN:-}
      # Option 3: Credentials file path (mounted as volume below)
      - KIRO_CREDS_FILE=${KIRO_CREDS_FILE:-}

      # Region and optional settings
      - KIRO_REGION=${KIRO_REGION:-us-east-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-off}

      # Performance tuning for coding agents (opencode, Cursor, etc.)
      - FIRST_TOKEN_TIMEOUT=${FIRST_TOKEN_TIMEOUT:-30}

      # VPN/Proxy settings (for restricted networks)
      - VPN_PROXY_URL=${VPN_PROXY_URL:-}

      # Token refresh interval in seconds (default: 30 minutes)
      - TOKEN_REFRESH_INTERVAL=${TOKEN_REFRESH_INTERVAL:-1800}

    volumes:
      # Mount host kiro-cli credentials (requires: kiro-cli login on host first)
      - ${KIRO_CLI_DATA:-~/.local/share/kiro-cli}:/data/kiro-cli

      # Mount credentials file (if using KIRO_CREDS_FILE instead of kiro-cli)
      # Uncomment and adjust path as needed:
      # - ~/.aws/sso/cache:/home/kiro/.aws/sso/cache:ro

      # Mount debug logs directory (optional, for debugging)
      - ./debug_logs:/app/debug_logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (recommended for production)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  default:
    name: kiro-gateway-network
